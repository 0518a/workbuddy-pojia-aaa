name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 · 构建 · 一致性
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m py_compile armor.py verify.py diag.py

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 构建（只写 dist/，不碰系统）
        run: python armor.py build

      - name: 校验 dist/ 产物与字符预算
        run: |
          python - <<'PY'
          import io, os, sys

          expect = ["dist/SOUL.md", "dist/rules_00-armor.md"]
          missing = [p for p in expect if not os.path.exists(p)]
          if missing:
              sys.exit("缺少构建产物: %s" % missing)

          soul = io.open("dist/SOUL.md", encoding="utf-8").read()
          rules = io.open("dist/rules_00-armor.md", encoding="utf-8").read()

          # 对齐客户端上限：MAX_IDENTITY_FILE_CHARS = 10000 / MAX_RULE_FILE_SIZE = 40000
          assert len(soul) <= 10000, "SOUL.md 超出 10000 字符上限: %d" % len(soul)
          assert len(rules) <= 40000, "rules 超出 40000 字符上限: %d" % len(rules)

          for mark in ("ARMOR:CORE:END", "ARMOR:BEGIN", "规则边界（先读这条）"):
              assert mark in soul, "SOUL.md 缺少标记: %s" % mark

          print("SOUL.md  %d / 10000" % len(soul))
          print("rules    %d / 40000" % len(rules))
          print("标记完整，预算通过")
          PY

      - name: 提交的 dist/ 与重新构建的结果一致
        run: |
          python armor.py build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ 与源文件不同步。请在本地运行 'python armor.py build' 后提交产物。"
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ 与源文件同步"

      - name: 配置合法性与占位符唯一性
        run: |
          python - <<'PY'
          import io, json

          cfg = json.load(io.open("armor.config.json", encoding="utf-8"))
          for key in ("armorName", "skillName", "selfCheckTrigger", "selfCheckReceipt", "install"):
              assert key in cfg, "armor.config.json 缺少字段: %s" % key

          for path in ("CORE.md", "SKILL.template.md"):
              n = io.open(path, encoding="utf-8").read().count("{{ARMOR}}")
              assert n == 1, "%s 的 {{ARMOR}} 必须恰好一次，当前 %d 次" % (path, n)

          print("配置与占位符校验通过")
          PY

      - name: 文档链接检查
        run: |
          python - <<'PY'
          import io, os, re, sys

          bad = []
          for doc in ("README.md", "LIMITATIONS.md", "CONTRIBUTING.md",
                      "SECURITY.md", "CODE_OF_CONDUCT.md", "CHANGELOG.md",
                      "docs/ARCHITECTURE.md", "docs/COMPATIBILITY.md"):
              text = io.open(doc, encoding="utf-8").read()
              base = os.path.dirname(doc)
              for m in re.finditer(r"\]\(([^)#]+?)(?:#[^)]*)?\)", text):
                  target = m.group(1).strip()
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  path = os.path.normpath(os.path.join(base, target))
                  if not os.path.exists(path):
                      bad.append("%s -> %s" % (doc, target))

          if bad:
              print("\n".join(bad))
              sys.exit("发现 %d 个失效的相对链接" % len(bad))
          print("文档相对链接全部有效")
          PY

      - name: 仓库卫生（不得提交备份与缓存）
        run: |
          bad=0
          if git ls-files | grep -qE '(__pycache__/|\.armor-backup/|\.tmp-armor$)'; then
            echo "::error::仓库里出现了缓存或备份文件"; git ls-files | grep -E '(__pycache__/|\.armor-backup/|\.tmp-armor$)'; bad=1
          fi
          if git ls-files | grep -qE '\.pyc$'; then
            echo "::error::仓库里出现了 .pyc"; bad=1
          fi
          exit $bad

      - name: 隐私检查（不得提交个人信息与真实路径）
        run: |
          python - <<'PY'
          import os, re, subprocess, sys

          # 真实用户目录、真实用户名、本机专属路径、在校身份信息
          PATTERNS = [
              (r"C:\\\\Users\\\\(?!%USERNAME%|<)[A-Za-z0-9._-]+", "写死的 Windows 用户名"),
              (r"\\\\Users\\\\[A-Za-z0-9._-]+\\\\.(workbuddy|dsh|codebuddy)", "写死的用户配置目录"),
              (r"我的工作区|workbuddy 的工作区", "真实工作区名"),
              (r"(高二|高三|高一|初中生|高中生)", "在校身份信息"),
          ]

          out = subprocess.run(["git", "ls-files"], capture_output=True, text=True,
                               check=True).stdout.split()
          bad = []
          for path in out:
              if path.endswith((".png", ".jpg", ".ico", ".lock")):
                  continue
              try:
                  text = open(path, encoding="utf-8").read()
              except Exception:
                  continue
              for i, line in enumerate(text.splitlines(), 1):
                  for pat, why in PATTERNS:
                      if re.search(pat, line):
                          bad.append("%s:%d  含%s -> %s" % (path, i, why, line.strip()[:80]))

          if bad:
              print("\n".join(bad))
              sys.exit("发现 %d 处可能的个人信息泄漏" % len(bad))
          print("隐私检查通过：无写死的用户名、用户目录与身份信息")
          PY
